name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # The Xcode 27 JSON project format needs Xcode 27.2+, which only the (preview) xcode-27 image has today.
    # Move to a GA macOS 27 image once GitHub ships one.
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project orbit.xcodeproj \
            -scheme orbit \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO \
            | tee build.log
